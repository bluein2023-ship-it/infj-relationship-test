<script id="dataset" type="application/json">{"headline": "理解感受，\n也照顾自己。", "about": "借用 MBTI 类型动力学中的 INFJ 视角，用聊天、约见、家庭相处与临时变化等日常情景，观察你如何验证直觉、回应他人并说清自己的需要。", "benefit": "看看哪些做法已经帮你减少误会、维护关系，以及在信息不足或压力上来时，还有哪些具体做法可以尝试。", "labels": ["直觉与验证", "关系与边界", "判断与论证", "现场与行动", "压力下的调整"], "codes": ["Ni", "Fe", "Ti", "Se", "综合"], "keys": ["210", "102", "021", "210", "102", "021", "210", "102", "021", "210", "012", "021", "220", "102", "021", "210", "102", "021", "210", "102", "021", "201", "102", "021", "201", "102", "102", "021", "201", "102", "021", "210", "102", "210", "012", "021", "210", "102", "120", "210", "021", "201", "102", "021", "210", "012", "021", "201", "102", "021"], "notes": [["在下结论前确认线索，可以减少误会和返工。", "把你看到的原话和自己的猜测分别写一句。", "如果猜测会改变你的安排，问一个对方容易回答的问题。"], ["顾及对方的同时说清自己的条件，双方更容易知道接下来怎么配合。", "下次有人临时求助时，先说你能帮多少、什么时候能帮。", "如果当面说不方便，事后用一句具体的话补上你的界限。"], ["把评价说得具体，对方更容易找到该改的地方。", "给反馈时指出一个可定位的例子，比如具体哪一行或哪一步。", "比较两个选项前，先约定用同一个标准。"], ["善用现场已有条件，可以缩短卡住的时间。", "给原方案设一个两分钟的排查上限。", "找一个现成的替代方案，先试一个可以撤回的小步骤。"], ["给压力反应留出缓冲，有助于保住眼前的任务，也方便之后继续沟通。", "想立刻长篇回复时，先存草稿并约一个回复时间。", "如果已经说重了，指出具体哪句话，并重新提出想解决的事。"]], "kind": "infj", "name": "INFJ", "questions": [["你发消息改约，朋友只回了一个“行”。", "问他新时间是不是不方便。", "当他同意了，见面时再看。", "觉得他有点不高兴，打算见面时主动补偿。"], ["连续两次聚餐都少了同一位朋友。", "下次照常约，看看他来不来。", "先猜他跟聚餐里的某个人闹了别扭。", "私下问他是时间难凑，还是想换种聚法。"], ["你提议去公园，朋友说“听起来不错，再想想”。", "觉得他其实不想去公园，开始找别的地方。", "问他还在考虑地点、时间，还是要不要出门。", "先看看自己选的公园有什么不方便。"], ["吃饭时，一位家人连续两天戴着耳机。以前你们常边吃边聊。", "找个方便的时候问他，最近吃饭想安静一点，还是偶尔也想聊。", "先按他想独处来相处，吃饭时尽量不打扰。", "觉得他在躲着你，接下来尽量和他错开吃饭。"], ["三个人约在同一个路口见，连续两次有人走到了对面。", "回想之前有没有发生过类似的事，再决定要不要改集合点。", "在群里说大家总是不仔细，下次一定要看清地址。", "对照两次发过的定位和照片，看看是不是同一个地方容易认错。"], ["你提议周末去郊外，群里半天没人回复。", "撤回提议，觉得大家应该没兴趣。", "补发两个出发时间，问大家是时间难凑，还是更想在市内见。", "等到晚上，看看大家空下来后会不会回复。"], ["你猜朋友不爱热闹，后来看到他主动组织了十人局。", "问他两次活动有什么差别，再调整自己的判断。", "把那次当成例外，以后还是尽量单独约他。", "觉得他可能只是不想参加你组织的活动。"], ["朋友两次问你“你几点能到？”你还没出门。", "发自己预计到达的时间。", "觉得他不相信你能准时，以后出门、上车和下车都主动报一遍。", "报预计时间，顺便问他是不是要赶下一班车或提前入场。"], ["你提议换条散步路线，同行的人两次都说“我们平时不走那边”。", "觉得他就是不喜欢换路线，以后少提新的走法。", "问他喜欢原路线的哪一点，或者新路线哪里不方便。", "先走原路线，换路的事下次再说。"], ["你提议下午一起打球，只有一人报名。你觉得地点太远，朋友觉得时间太早。", "问两位没报名的人，是地点、时间，还是活动本身不合适。", "先换到近一点的球场，看看有没人来。", "先按地点太远来解释，之后都只约附近的球场。"], ["朋友晚上十一点想打电话吐槽，你明早七点要起。", "接起来，让他讲到想挂为止。", "回“我今晚得睡了，明天再说”。", "回“今晚聊不了，明天午休我能听你说二十分钟”。"], ["朋友第三次请你帮忙找一张照片，你自己也答应今晚发一组照片给别人。", "先替他找，自己的照片晚点再发。", "说“我今晚也得整理照片。我能告诉你在哪个相册，没法替你一张张找”。", "说“我今晚有自己的安排，这次帮不了”。"], ["聚餐时，有人连续两次拿你迟到开玩笑。", "当场说“刚才那句我听着不舒服，别再拿这个开玩笑了”。", "散场后私下告诉他，你希望这个玩笑到此为止。", "当场一起笑，之后减少参加有他的聚会。"], ["家人替你答应了周六的饭局，你已经和朋友约好同一时间见面。", "说自己周六有安排，请家人帮忙取消。", "取消和朋友的约定，按家人答应的时间去。", "说自己已有约，和家人商量怎么告知对方，并请家人下次先问你。"], ["朋友倒苦水，你提了两条建议，他回“我知道”。", "继续讲完剩下的建议，想帮他少走弯路。", "问“你想让我听一会儿，还是一起想怎么办？”", "先收起建议，听他把事情讲完。"], ["群里两个人争执，有人点名请你评理，你只看到了后半段。", "说自己没看到前因，先问双方希望解决哪件事。", "说自己只看到了后半段，先不表态。", "先替语气比较委屈的一方说话，免得他被围攻。"], ["几个人准备出门，有人当众说“你发错集合地点了”，但他打开的是昨天的消息。", "私下发最新定位，请他在群里更新一下。", "先认下，免得大家当场争起来。", "当场说“那条是昨天的，我把今天的定位再发一次”。"], ["借给朋友的书已逾期两周，下周你要用。", "暂时不催，打算到时另外找一本。", "发“我周一要用，你能周日还吗？不方便我可以去拿”。", "发“这周能把书还给我吗？”"], ["几个人一起吃东西，有人坚持去一家超过你预算的店。", "说自己这顿最多能花多少，提议换一家，或吃完再汇合。", "说“这家有点贵，能不能再看看？”", "先答应去，之后少买自己本来要买的东西。"], ["朋友希望你劝另一位朋友道歉，你没在场。", "安慰他，同时说明自己不方便代传。", "先替他发消息，请对方道歉。", "陪他整理想说的话，让他自己决定发不发。"], ["两个人都说自家到公园“很近”，你们只能选一个地方集合。", "选听起来更顺路的地方。", "问清从集合点步行各要几分钟，中间要不要绕路。", "打开地图看一眼两处位置，再凭大致距离选。"], ["朋友写了一条活动通知，你说“有点难懂”，他问具体哪里难懂。", "指出集合时间藏在最后一段，建议把时间和地点移到第一行。", "说“就是整体有点乱”，请他自己再读一遍。", "圈出最难读的那一段，让他先改那里。"], ["朋友说一种叠衣服的方法“快一倍”，他只试过一件。", "接下来几天用新方法，看看自己感觉有没有变快。", "觉得看起来确实快，转发时也说“能快一倍”。", "找几件差不多的衣服，用两种方法各叠一轮，对比用时。"], ["你推荐从公园正门进，朋友指出正门到你们要去的球场，比侧门多走十五分钟。", "先讲正门附近有小店、路也好认，距离晚点再说。", "问大家还有多少时间，再比较两条路线。来不及就走侧门。", "先收回推荐，把地图上的步行时间重新查一遍。"], ["大家只能选一个游戏。一个人说甲“更适合一起玩”，另一个人说乙才适合。", "先问这次更在意“人人能同时玩”还是“一轮能很快结束”，再按同一标准比。", "先选听起来能让更多人参与的那个。", "请两人各说一个理由，再一起决定。"], ["朋友发来一张对话截图，问你“是不是他先骂人”。", "只评价截图里那句话听起来有多冲。", "根据这张图，直接判断是谁先挑起争执。", "说截图里的话确实冲，再问前后消息，暂不判断谁先开骂。"], ["你答应“等会儿”把合照发过去，对方以为十分钟，你以为晚饭后。", "回“我晚一点发，发了告诉你”。", "解释自己说的“等会儿”就是今天之内，请他再等。", "回“我七点前发。你如果现在要用，告诉我急需哪一张”。"], ["你帮朋友从两张邀请图里选一张，第一眼更喜欢颜色鲜艳的那张。", "选颜色鲜艳的，告诉朋友自己喜欢这个配色。", "先看两张的时间地点是否齐全、手机上字是否看得清，再决定。", "把另一张再看一遍，确认有没有漏掉自己喜欢的地方。"], ["你在群里说公园六点关门，后来发现你看错了，实际是五点。", "在原群更正时间，并说明原定几点到的安排还能不能用。", "先改自己的计划，等有人再问时告诉他。", "在原群更正关门时间，集合安排晚点再确认。"], ["朋友说你安排活动“只顾自己”，你觉得他说得太重。", "先解释当时为什么这么安排。", "先逐条说自己已经为大家考虑过什么。", "问他指哪项安排，弄清具体影响后再回应。"], ["几个人准备边看手机里的图边学折纸，手机突然关机。桌上有一件折好的样品。", "先找充电线，等手机开机再继续。", "问谁还能打开图片，同时用样品带大家看第一步的折痕。", "先用样品口头讲自己记得的步骤。"], ["照菜谱做饭时发现少了一种调料，客人二十分钟后到。", "先尝现有味道，少量试加手边最接近的调料。", "继续做，把缺的调料省掉。", "暂停做菜，出门买齐原调料再继续。"], ["走到换乘口才发现线路临时停运，你还有半小时赴约。", "按平时的经验，先走去常用的公交站。", "在站里反复刷新原线路的恢复时间。", "看实时备选路线，发一个新的预计到达时间。"], ["你本来要给朋友看十张照片讲一件趣事，他还有五分钟就要走。", "先选一两张最能讲清事情的照片，其余之后发给他。", "先讲准备好的前几张，没讲完的下次再说。", "照原顺序把十张都快速翻一遍。"], ["椅子装到一半，发现螺丝对不上。", "把不同的螺丝挨个往孔里试，先把这一块装上。", "放下工具，从头再看一遍说明书。", "对照当前步骤的零件编号和孔位，分清是拿错还是缺件。"], ["你想做旅行相册，有两百张照片，今晚只剩半小时。", "先把整本相册的目录和版式定下来。", "挑六张先做一页，用这一页判断版式要不要改。", "建一个候选相册，把明显想留的照片放进去。"], ["几个人想把桌子搬到隔壁，但桌面比门框宽。", "先比较桌面、桌腿和门框的宽度，再决定能否转向通过。", "先请另一个人从门框另一侧看看还有多少余量。", "先按原来抬桌子的方向多试几次。"], ["几个人跟着你去集合点，群里置顶的定位是旧的，还有人正按它导航。", "先逐个告诉正在路上的人新地点。", "先发一条“定位改了”，之后有空再改置顶。", "先换掉旧置顶，点开确认定位能用，再提醒群里看新地址。"], ["走到餐厅才发现停业，另外两人快到了。", "在群里说店没开，等大家一起决定。", "拍下门牌，确认附近一家有位，再发新地址。", "照原约定在门口等，三人到齐后再找店。"], ["你已经做了半张拼贴画，才发现要装进的相框比纸小一圈。", "对照相框标出能保留的部分，再决定裁哪里或挪哪些图。", "收好这张，从头做一张刚好能放进相框的。", "把原来的拼贴做完，最后再看能放进去多少。"], ["你答应今晚把照片发给朋友，同时两个群在催你回消息。你看着手机十分钟还没开始选图。", "按消息弹出的顺序逐条回。", "先静音十分钟，确定眼下最急的一件事并动手。", "把要回复和要做的事全记下来，再决定从哪开始。"], ["你正准备出门，朋友突然发来“我对你挺失望的”。", "回“我看到了，今晚七点有空聊”，到时先问他指哪件事。", "立刻停下来，发一长段消息解释自己的情况。", "先出门，等有空再打开对话看他有没有补充。"], ["午饭还没吃，你正在和朋友拼图。他说你刚拼的一大片方向错了，你越看越烦。", "先把最明显不合的两块取下来，剩下的晚点看。", "立即逐条解释为什么你觉得自己拼得没错。", "先吃点东西，回来再和他一起看从哪一块开始对不上。"], ["一天内两个人取消约定，你开始想“是不是谁都不想见我”。", "把后面还没确定的邀约也撤掉。", "看两人各自给的原因，晚些再决定要不要另约。", "今晚先做自己的安排，明天再想。"], ["你在群里回话太冲，隔了十分钟才发现。", "在原群说刚才哪句话说重了，再重述自己要讨论的事。", "私下给当事人发一句“刚才我语气急了”。", "等话题翻过去，下次聊天时对他客气一些。"], ["连续三天你都在帮别人整理聚会照片，自己的那份还没发。今晚又有人请你帮忙挑图。", "先答应，准备晚点再做自己的。", "说今晚接不了，继续整理自己那份。", "说今晚接不了，同时问等自己照片的人哪几张最急，先发那几张。"], ["周六本来想睡个懒觉，两个群不断@你，只说“有空看一下”。", "先把消息都回完，再继续休息。", "看一眼是否有今天必须处理的事，其余先静音。", "全部静音，中午再统一看。"], ["你教朋友玩一个新游戏，他说“有点难跟”，回家后你还在反复想。", "问他是从哪条规则开始听不懂，下次先换一种方式讲那条。", "当晚把整套讲法从头到尾重写。", "记下这句反馈，下次再教人之前看一眼。"], ["你在争执里越说越快，对方说“我已经听不进去了”。", "停下来，等对方愿意开口。", "把最后一点说完，免得对方误解你的意思。", "提议停十分钟并约好回来聊，回来后先复述对方在意的事。"], ["朋友一小时后要来玩，你原本打算先收桌子、准备饮料、找出游戏，还没开始。", "先把桌子收拾到自己满意，再做剩下两件事。", "先确定开始玩必须准备什么，留出能玩的桌面，把游戏找出来。", "把三件事都记下来，等朋友到了再一起弄。"]], "praise": [["一句“新时间方便吗”，给朋友留了把话说完整的机会。", "这么一问，你们可以在见面前把时间谈妥，少带着猜测赴约。"], ["你留意到了那位连续缺席的朋友，也给他留了私下解释的空间。", "如果聚餐的时间或形式确实不合适，你们就有了重新约的起点。"], ["问清“再想想”指什么，能让一句客气话变成一个谈得下去的问题。", "你可以先改真正卡住的地方，省下到处找原因的力气。"], ["你记得以前饭桌上常聊天，也允许家人今天只想安静。", "把这两个可能性都留着，会让家人更容易说出真实需要。"], ["两次走错路口，你先回看定位和照片。这个检查很体贴。", "如果标记本来就容易认错，换张路口照片可能比一遍遍提醒更有用。"], ["群里安静的时候，你把出发时间说得更具体，让大家有话可接。", "大家只要回一个时间或地点，就能把原来悬着的提议往前推。"], ["原来的印象遇到了新线索，你愿意听听那两次聚会有什么不同。", "朋友可以有几种相处方式，你也多了一种约他的办法。"], ["你给了一个到达时间，还想到朋友可能在等这个时间做下一步安排。", "如果他要赶车，你们现在就能商量先走还是改地方。"], ["问“原来那条路哪里方便”，是在认真对待对方已有的经验。", "你们可以把他在意的部分留下来，再一起看看新路线。"], ["你把地点和时间都放进问题里，没报名的人更容易说出真正的障碍。", "问到两句具体回答，也许就够你定下下一次怎么约。"], ["晚上十一点还惦记朋友，同时记得自己明早要起，这个分寸拿得很好。", "“明天午休二十分钟”给朋友一个能期待的时间，也给你留下一晚完整的休息。"], ["告诉朋友去哪个相册找，已经给了他一个很实在的帮助。", "你还留得出时间履行原来的承诺，答应的两件事都更容易收尾。"], ["你把玩笑带给你的不舒服说出来了，这一步需要勇气。", "说清哪句话让你介意，给了对方及时收住、下次留意的机会。"], ["面对家人已经替你答应的事，你把自己原有的约定也摆上了桌面。", "一起商量怎么告知对方，既有人接住这次变动，也让下次可以先征询你。"], ["“想让我听，还是一起想办法？”这句话把选择交还给了正在难受的朋友。", "他可以直接告诉你现在需要什么，你也不用凭猜测一直给建议。"], ["被点名评理时，你如实说自己只看到一部分，还把话题拉回了双方想解决的事。", "这能给两边留出说经过的机会，减少群里继续站队。"], ["你用“昨天的消息”和“今天的定位”把误会说得很清楚。", "正在准备出门的人能立即找到新地点，指出旧消息的人也有台阶可下。"], ["你说清周一要用书，还主动给了自己去拿的办法。", "朋友知道什么时候需要还，也知道没空送还时该怎么办。"], ["说出这顿能花多少钱，需要一点坦率。你还给了同行的人一个可选安排。", "预算说清了，大家更容易找到能一起吃饭的地方，你也能安心按自己的范围花钱。"], ["陪朋友理清他想说的那句话，是一种很扎实的支持。", "他能保留自己的表达和决定权，你也少了一层夹在两人中间的压力。"], ["你把“很近”问成了几分钟、要不要绕路。", "每个人都能拿同一把尺子看集合点，迟到的可能也更容易估计。"], ["“集合时间在最后一段”这句话，比一句“有点乱”更容易帮到朋友。", "他知道要把哪两行往前挪，读通知的人也能更快找到地点。"], ["你愿意用差不多的衣服各试一轮，让“两倍快”有了可对照的用时。", "即使新方法只快了一点，你也能据实决定值不值得换。"], ["侧门能省十五分钟时，你愿意把原推荐放回大家的时间表里看一遍。", "正门的便利和侧门的速度都算进去了，同行的人更容易一起决定。"], ["先问大家要“同时玩”还是“每轮短”，把原本各说各话的争论对齐了。", "有人改变主意时，也能说清楚自己在乎的是哪条条件。"], ["你既回应了朋友对截图那句话的感受，也给未知的前文留了位置。", "这样朋友知道你听见了，另一方的动机也有机会被完整理解。"], ["把“等会儿”换成“七点前”，一下就说清了对方要等多久。", "问一句急需哪张，还可能用很小的力气先帮对方解决当下的事。"], ["你看到了鲜艳配色，也记得邀请图要让人在手机上读清时间地点。", "朋友可以据此判断哪张图更好用，收到图的人也少一次追问。"], ["公园关门时间说错了，你回到原群更正，还想到了大家已经约好的时间。", "这一句可能帮正在准备出门的人少跑一趟。"], ["听到“只顾自己”，你愿意先找出对方说的是哪项安排。", "等事情具体了，你们就有机会处理那次影响，解释也更容易被听进去。"], ["手机关机时，你还看见了桌上的折纸样品。", "一边找图片，一边用现成的折痕继续，能让等着的人先学到第一步。"], ["客人快到了，你愿意先尝一口，再少量试手边的调料。", "味道合适就能接着做，试出来不合适也还有调整的余地。"], ["发现线路停运，你查了当下能走的路，也把新的时间告诉了等你的人。", "你有路可走，对方也能决定先进去还是再等一会儿。"], ["五分钟里先挑最能讲清的照片，很懂得照顾对方剩下的时间。", "朋友可以听完一个完整的小故事，其他照片之后还看得到。"], ["螺丝对不上，你先看编号和孔位，给这一步的线索留足了位置。", "确认拿错还是缺件以后，手里已经装好的部分也有机会保留。"], ["半小时先做出一页，已经够你看清版式是否合适。", "做一页花的力气有限，之后挑照片和排版却都有了参考。"], ["你愿意先看桌腿、桌面和门框之间有没有可以转动的空间。", "多确认一次方向，可能省下几个人费力来回抬桌子。"], ["换置顶之后还点开确认，这个小动作照顾到了正在路上的人。", "大家看到的是同一个能用的位置，后面也少几条“到底去哪”的消息。"], ["原餐厅没开，你先确认附近有位，再把地址发出去。", "快到的人收到的是可以直接去的地方，临时改约少了一次折腾。"], ["拼贴画做到一半，你先看看原稿有哪些部分值得留下。", "这样既能照顾相框尺寸，也能保住前面已经花进去的心思。"], ["盯着手机动不了的时候，你选择先静音一会儿，给最急的事腾出位置。", "把起点缩成一件事，可以让忙乱慢慢变成手上做得动的动作。"], ["出门前收到一句“我对你挺失望的”，你还是给这段对话留了一个时间。", "对方知道你会回来谈，你也有机会在手头事情结束后听清具体发生了什么。"], ["午饭还没吃、拼图又被指出不对，你先照顾了自己的饥饿。", "回来再看拼图，可能更容易和朋友一起找出是哪块开始对不上。"], ["两个人同一天取消，你还是愿意分别看看他们给的原因。", "这给了你一点缓冲，也让两件独立的小事各自有自己的解释。"], ["意识到语气重了，你愿意回到原群说明自己刚才哪里说重了。", "当事人有机会收到明确的修复，其他人也知道讨论可以回到哪件事。"], ["你给今晚的帮助划了界限，还问清哪几张照片最急。", "手上的事有了优先顺序，等照片的人也能先拿到用得上的几张。"], ["你先看有没有今天必须处理的事，然后给休息留出空间。", "急事能被接住，其余消息也不会把一个早上拆成许多段。"], ["一句“有点难跟”让人容易想很久，你试着把它问成一条具体的规则。", "对方指出卡住的那一步以后，下次只要从那个地方改起。"], ["听到对方已经听不进去了，你给了彼此十分钟，也答应回来继续。", "这个约定让暂停更容易被理解，回来先复述还有助于确认彼此谈的是同一件事。"], ["一小时里先腾出能玩的桌面、找出游戏，这个取舍很照顾当下。", "朋友到的时候可以先开始玩，饮料和其他细节还能慢慢补。"]]}</script>
<script>
const d=JSON.parse(document.querySelector('#dataset').textContent);
const app=document.querySelector('#app');
const key='scenario-'+d.kind+'-v1';
let saved={};
try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{}
const answers=Array.from({length:50},(_,i)=>Number.isInteger(saved.answers?.[i])&&saved.answers[i]>=0&&saved.answers[i]<3?saved.answers[i]:null);
let index=0;
let complete=Boolean(saved.complete)&&answers.every(a=>a!==null);
const done=()=>answers.filter(a=>a!==null).length;
const score=(i,a=answers[i])=>a===null?0:Number(d.keys[i][a]);
const tone=i=>'--color:var(--c'+i+')';
function save(){try{localStorage.setItem(key,JSON.stringify({answers,complete}))}catch{}}
function show(html,focus=false){app.innerHTML=html;window.scrollTo(0,0);if(focus)app.querySelector('h1')?.focus({preventScroll:true})}
function graph(values,total){
  if(d.kind==='intj')return '<div class="columns" aria-hidden="true">'+values.map((v,i)=>'<div class="column" style="'+tone(i)+'"><div class="column-track"><span class="column-fill" style="height:'+(v*5)+'%"></span></div><small>'+d.codes[i]+'</small></div>').join('')+'</div>';
  return '<svg class="rings" viewBox="0 0 230 230" aria-hidden="true">'+values.map((v,i)=>{const r=101-i*14,c=2*Math.PI*r;return '<circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="9"/>'+(v?'<circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--c'+i+')" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(v*c/20)+' '+c+'" transform="rotate(-90 115 115)"/>':'')}).join('')+'<text x="115" y="121" text-anchor="middle" font-size="22" font-weight="800">'+(total??'5 项')+'</text></svg>';
}
function startButton(){return '<button class="primary" data-action="start">'+(complete?'查看上次结果':done()?'继续测试':'开始测试')+' →</button>'}
function home(){
  show('<section class="hero"><div><div class="kicker">认识你的日常应对方式</div><h1 tabindex="-1">'+d.headline+'</h1><p>'+d.about+'</p>'+startButton()+'</div><div class="hero-art"><p class="artlabel">五项结果 · 图表示意</p>'+graph([17,13,15,10,12])+'</div></section><div class="stats"><div><strong>50</strong><span class="quiet">道情景题</span></div><div><strong>5–7</strong><span class="quiet">分钟预计用时</span></div><div><strong>5</strong><span class="quiet">观察维度</span></div></div><section class="card"><h2>五个观察维度</h2><div class="grid">'+d.labels.map((x,i)=>'<div class="tile" style="'+tone(i)+'"><i class="dot"></i><h3>'+x+'</h3><p>'+d.notes[i][0]+'</p></div>').join('')+'</div></section><section class="card"><h2>做完能看到什么？</h2><p>'+d.benefit+'</p><div class="grid"><div class="tile"><h3>总档位与单项分数</h3><p>低阶、中阶或高阶，以及五项各自的分数与表现。</p></div><div class="tile"><h3>优势与场景练习</h3><p>依据实际选择，看到做得好的部分、带来的好处，以及类似场景的其他做法。</p></div></div></section><section class="card center"><h2>按最近三个月的实际表现作答</h2><p class="quiet">选你通常最先会做的事。答案保存在当前浏览器，可随时回来继续。</p>'+startButton()+'</section>');
}
function quiz(focus=true){
  const q=d.questions[index];
  show('<div class="reader"><div class="row"><button class="secondary" data-action="home">← 首页</button><span class="quiet">已答 '+done()+'／50</span></div><div class="progress" role="progressbar" aria-label="已答题数" aria-valuemin="0" aria-valuemax="50" aria-valuenow="'+done()+'"><span style="width:'+done()*2+'%"></span></div><section class="card"><div class="kicker">第 '+(index+1)+'／50 题</div><h1 class="qhead" tabindex="-1">'+q[0]+'</h1>'+q.slice(1).map((x,j)=>'<button class="choice" data-option="'+j+'" aria-pressed="'+(answers[index]===j)+'"><span class="letter">'+('ABC'[j])+'</span><span>'+x+'</span></button>').join('')+'<div class="actions"><button class="secondary" data-action="back" '+(!index?'disabled':'')+'>上一题</button><button class="primary" data-action="next" '+(answers[index]===null?'disabled':'')+'>'+(index===49?'查看结果':'下一题 →')+'</button></div></section></div>',focus);
}
function summarize(){
  const scores=d.labels.map((_,g)=>answers.slice(g*10,g*10+10).reduce((sum,a,j)=>sum+score(g*10+j,a),0));
  const total=scores.reduce((a,b)=>a+b,0);
  const gate=d.kind==='intj'&&scores.some(n=>n<10);
  const stage=total<50?'低阶':total<75||gate?'中阶':'高阶';
  return {scores,total,stage,limited:total>=75&&gate};
}
const rank=n=>n<10?'低':n<15?'中':'高';
const gentle=d.kind==='infj';
const paragraphList=lines=>lines.map(line=>'<p>'+line+'</p>').join('');
function letter(total,good){
  const first=gentle
    ? '谢谢你花时间做完这 50 题。朋友只回了一个字、家人替你答应了一件事、临出门又收到一条让人心里一紧的消息。这些小事平时很快就过去了。你愿意回头看看自己当时会怎么想、怎么做，这份认真值得被看见。'
    : '50 题做完了，干得好。你已经把一批平时来不及复盘的小事放到一起看了：信息少的时候怎么判断，计划卡住的时候从哪里下手，对方有不同意见时又怎么谈。现在你手上有具体的例子，可以拿来决定下一步。';
  const example=good.length&&score(good[0])===2&&answers[good[0]]===d.keys[good[0]].indexOf('2')?(gentle?'读到第 '+(good[0]+1)+' 题时，可以为自己高兴一下。'+d.praise[good[0]][1]:'第 '+(good[0]+1)+' 题值得回看。'+d.praise[good[0]][1]):gentle
    ? '有些时刻，你可能会先把眼前的事情过完，等有了余力才知道自己想说什么。那段缓冲也有它的用处。愿意回来想清楚、补上一句话，已经是在照顾自己，也在给关系一个继续谈的机会。'
    : '这次有些选择偏向先把眼前的事处理掉。这个习惯有它的用途。想练得更灵活，就挑一个你最常卡住的场景，加一步检查，看看结果会不会变。';
  const close=gentle
    ? (total>=75?'已经顺手的那些小动作，值得你继续信任。哪天累了，或者话到嘴边又停住了，也可以给自己一点时间。晚些再开口，依然能把重要的话说出来。':'如果某个分数让你有点沮丧，可以先把注意力放回那道题：当时你在顾虑什么？下次只多做一点点会是什么？一句“我晚点再回你”也算进展。能把这句话说出来的那次，就值得记住。')
    : (total>=75?'你已经有几套能用的办法。下一步挑最容易失灵的那类场景，给它配一个备用动作。试一次，看看有没有少来回一轮、少返工一次，或者更快听清对方到底在说什么。':'先挑一个反复出现的卡点。下次遇到它，只改一个动作。比如先问清一个条件，再给方案。试完看结果：有没有更快推进？对方有没有少解释一遍？能回答这两个问题，这次调整就有收获。');
  return '<section class="card letter-note"><h2>'+(gentle?'给认真做完这 50 题的你':'做完 50 题，给你的几句话')+'</h2>'+paragraphList([first,example,close])+'</section>';
}
const specificAdvice={
  infj:{
    0:['一条短回复能承载的意思很有限。如果你已经开始想见面时要怎么弥补，可以先让自己停在已知的那部分。','想确认安排时，问“周日下午三点你方便吗？”这句话很容易回。','如果时间已经定了，也可以照常去见面。等对方提起，再聊他有没有介意改约。'],
    10:['半夜有人来找你，想陪陪他很自然。明天要早起也是一件值得照顾的事。','有余力约时间时，可以说“我今晚要睡了，明天午休能听你说二十分钟”。','明天也排满了，就说“我今天聊不了，这两天也没整块时间”。把自己能给的范围说清楚就可以。'],
    12:['被拿来开玩笑时，有人会下意识跟着笑。过了一阵才觉得不舒服，也可以再开口。','如果当时说得出口，可以短短一句：“刚才那句我听着不舒服，换个话题吧。”','更愿意私下说的话，散场后发一句：“刚才你两次提我迟到，我不太喜欢被这样开玩笑，下次别提了好吗？”'],
    41:['穿鞋出门时突然看到这句话，想立刻解释很可以理解。你手上还有一件马上要做的事。','如果担心对方以为你没看见，可以先说：“我看到了，我现在要出门，今晚七点聊好吗？”','时间还说不准，就回：“我看到了，到地方后回你。”等安顿下来，先听听对方说的是哪件事。']
  },
  intj:{
    7:['拼边框和按颜色分都能起步。先给两种做法五分钟，桌上的进度会提供比争论更直接的信息。','拼图块多就分工：一个找边缘，一个做颜色组，五分钟后看能不能接起来。','桌面太小的话，先共同清出一块空位，再决定哪组图案最适合先做。'],
    35:['架子在斜桌上晃，先把桌面这个变量排掉。挪到平地轻推一下，再决定动哪颗螺丝。','如果只在斜桌上晃，先换放置面。已经装好的部分可以直接保留。','在平地还晃，就从第一个能看到松动的连接处查起，避免整架重装。'],
    45:['听到“每次”，先把范围收回来。你记得的反例可以留到后面，眼下先定位对方在说哪一次。','有怀疑的场景就直接问：“是刚才选路线那次吗？哪一步你觉得我替你定了？”','完全没想到就请他举一例。听完再说你记得的经过，接下来明确哪一步该由谁决定。'],
    49:['朋友已经到了，先把可用选项和等待时间摆出来。解释取消原因可以晚一点。','如果对方还想继续，直接问：“近的不用等，另一个要半小时，去哪个？”','如果他已经没兴致了，给出改天这个选项。今天的变动到这里就能收尾。']
  }
};
function feedback(i,g,positive){
  const [q,...options]=d.questions[i];
  const [,practice,alternative]=d.notes[g];
  const chosen=options[answers[i]];
  const top=options.find((_,a)=>score(i,a)===2&&a!==answers[i]);
  const smallerStep=options.find((_,a)=>score(i,a)===1&&a!==answers[i]);
  let lines;
  if(positive){
    const firstTop=d.keys[i].indexOf('2');
    const tied=score(i)===2&&answers[i]!==firstTop;
    const observed=score(i)===2&&!tied;
    const ending=gentle
      ? ['这一步值得记下来。以后又遇到类似的事，你知道自己已经有一种可以用的办法。','这个小动作很值得保留。哪天没有余力做更多，能做到这里也已经有帮助。','可以把这次的做法留给以后的自己。再遇到类似的情况，你已经知道从哪里开始。']
      : ['这一步可以复用。条件差不多时，直接从这里起手。','把这个动作留下来，下次卡在相似的地方就用它开局。','下次遇到同类问题，照这个顺序走一遍，再看结果。'];
    const opening=tied
      ? (gentle?'你选了等散场后私下说清楚。这给了自己和对方一个更从容的开口时机。':'你提出重写内容、移除可识别的细节。这一步把分享的目的和当事人的隐私都考虑进去了。')
      : (score(i)===0&&gentle?'改约后收到一个“行”，你先想到见面时照顾朋友的感受。这份体贴可以留下，确认他介不介意之后再决定怎么表达。':score(i)===0?'先进去、到了再联系，至少让自己手上的时间能继续用。把碰头地点说清楚，这个安排就更稳。':gentle?'你给这件事找到了一个可以开始的动作。能先做一点，已经给接下来的处理留了空间。':'这个选择先定了一个起点。手里有个明确动作，接下来就有地方可以调整。');
    lines=[observed?d.praise[i][0]:opening,observed||tied?d.praise[i][1]:score(i)===0?(gentle?'多问一句时间是否方便，你也可以少背一点猜测带来的负担。':'发一句“我在里面入口等”，对方到了就知道怎么找你。'):d.notes[g][0],ending[g%ending.length]];
  }else{
    const lead=gentle
      ? ['给自己一点时间是可以的。如果这件事还需要处理，可以把下一步缩成一个小动作。','这个场景很容易一下子顾不过来。下次可以只试一个变化，看看会不会更轻松。','如果原来的做法让你事后还惦记着，可以试试把需要说的那一步提前一点。']
      : ['先动一个环节。动作足够小，你才能看出改变带来的效果。','这个场景有一个可以立即换掉的步骤。挑一次试试，再看有没有少一次来回。','下一轮只改第一步。给它一次机会，看看事情能不能更快走下去。'];
    lines=specificAdvice[d.kind][i]??[lead[g%lead.length],top?'同场景可以试：'+top:practice,smallerStep?(gentle?'想先试轻一点的做法，也可以这样开始。':'想把改动再缩小，就从这一步开始。')+smallerStep:alternative];
  }
  return '<div class="tile feedback"><h3>'+d.labels[g]+' · 第 '+(i+1)+' 题</h3><p class="quiet">'+q+'</p><blockquote>你的选择 · '+chosen+'</blockquote>'+paragraphList(lines)+'</div>';
}
function result(){
  const {scores,total,stage,limited}=summarize();
  const groups=scores.map((_,i)=>i);
  const high=groups.slice().sort((a,b)=>scores[b]-scores[a]);
  const low=groups.slice().sort((a,b)=>scores[a]-scores[b]);
  const indices=g=>Array.from({length:10},(_,i)=>g*10+i);
  const good=high.map(g=>indices(g).find(i=>score(i)===2)).filter(i=>i!==undefined).slice(0,3);
  if(good.length===0){const partial=high.flatMap(indices).find(i=>score(i)===1);if(partial!==undefined)good.push(partial);else good.push(d.kind==='infj'?0:3);}
  const grow=low.map(g=>indices(g).find(i=>score(i)===0)??indices(g).find(i=>score(i)===1)).filter(i=>i!==undefined).slice(0,2);
  const sub=d.kind==='intj'?'<section class="card"><h2>四种补充练习</h2><p class="quiet">每种用两题回顾具体做法。</p><div class="grid">'+[
    ['扩展备选（Ne 视角）',[40,44],'给原目标和活动形式各想一个备选。'],
    ['确认对方需要（Fe 视角）',[41,45],'解释前先问对方现在想谈什么。'],
    ['调用具体经验（Si 视角）',[42,46],'把上次漏掉的细节变成这次的提醒。'],
    ['检查逻辑与定义（Ti 视角）',[43,47],'一次只改一个条件，或先核对双方对同一个词的理解。']
  ].map(([label,ids,tip])=>'<div class="tile"><h3>'+label+' · '+ids.reduce((a,i)=>a+score(i),0)+'／4</h3><p>'+tip+'</p><p class="quiet">回顾第 '+ids.map(i=>i+1).join('、')+' 题</p></div>').join('')+'</div></section>':'';
  show('<section class="card overview"><div><h1 class="qhead" tabindex="-1">你的情景应对结果</h1><div class="total">'+total+' <small>／100</small></div><div class="pill">'+stage+'</div><p class="quiet">'+(limited?'总分已达高阶区间。待拓展维度：'+d.labels.filter((_,i)=>scores[i]<10).join('、')+'。':stage==='高阶'?'你在多类场景中展现了不同的应对做法。':stage==='中阶'?'你在一些场景会调整做法，有些场景更习惯用第一反应。':'先从一种容易尝试的新做法开始。')+'</p></div>'+graph(scores,total)+'</section><section class="card"><h2>五项分数</h2><p class="quiet">每项独立按 20 分计算。图形长度表示该项得分比例。</p>'+d.labels.map((x,i)=>'<div class="metric" style="'+tone(i)+'"><div class="row"><span><i class="dot"></i>'+x+'</span><strong>'+scores[i]+'／20 · '+rank(scores[i])+'</strong></div><div class="meter" aria-hidden="true"><i style="width:'+scores[i]*5+'%"></i></div></div>').join('')+'</section>'+letter(total,good)+'<section class="card"><h2>你已经做得好的地方</h2>'+(good.length?good.map(i=>feedback(i,Math.floor(i/10),true)).join(''):'<p>这次可以先从你得分最高的“'+d.labels[high[0]]+'”开始回顾。想一件类似的小事，看看原来的做法解决了什么。</p>')+'</section><section class="card"><h2>下一次还可以怎么做</h2>'+(grow.length?grow.map(i=>feedback(i,Math.floor(i/10),false)).join(''):'<p>你这次每题都选择了本问卷评分最高的做法。可以回想最近一次遇到类似情况时，你是在什么条件下做到的。</p>')+'</section>'+sub+'<div class="row end"><button class="secondary" data-action="home">返回首页</button><button class="secondary" data-action="restart">重新测试</button></div>',true);
}
app.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  const option=button.dataset.option;
  if(option!==undefined){
    answers[index]=Number(option);complete=false;save();
    app.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    const progress=app.querySelector('.progress');
    progress.setAttribute('aria-valuenow',done());progress.firstElementChild.style.width=done()*2+'%';
    app.querySelector('.reader > .row .quiet').textContent='已答 '+done()+'／50';
    app.querySelector('[data-action=next]').disabled=false;return;
  }
  switch(button.dataset.action){
    case 'home':home();break;
    case 'start':if(complete){result();break}index=done()===50?49:answers.indexOf(null);quiz();break;
    case 'back':if(index>0){index--;quiz()}break;
    case 'next':
      if(answers[index]===null)break;
      if(index<49){index++;quiz();break}
      if(done()<50){index=answers.indexOf(null);quiz();break}
      complete=true;save();result();break;
    case 'restart':
      if(!confirm('清除本次答案，重新开始？'))break;
      answers.fill(null);complete=false;index=0;save();quiz();break;
  }
});
home();
</script>
</body></html>
