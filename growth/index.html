<script id="dataset" type="application/json">{"headline": "理解感受，\n也照顾自己。", "about": "借用 MBTI 类型动力学中的 INFJ 视角，用聊天、约见、家庭相处与临时变化等日常情景，观察你如何验证直觉、回应他人并说清自己的需要。", "benefit": "看看哪些做法已经帮你减少误会、维护关系，以及在信息不足或压力上来时，还有哪些具体做法可以尝试。", "labels": ["直觉与验证", "关系与边界", "判断与论证", "现场与行动", "压力下的调整"], "codes": ["Ni", "Fe", "Ti", "Se", "综合"], "keys": ["210", "102", "021", "210", "102", "021", "210", "102", "021", "210", "012", "021", "220", "102", "021", "210", "102", "021", "210", "102", "021", "201", "102", "021", "201", "102", "102", "021", "201", "102", "021", "210", "102", "210", "012", "021", "210", "102", "120", "210", "021", "201", "102", "021", "210", "012", "021", "201", "102", "021"], "notes": [["在下结论前确认线索，可以减少误会和返工。", "把你看到的原话和自己的猜测分别写一句。", "如果猜测会改变你的安排，问一个对方容易回答的问题。"], ["顾及对方的同时说清自己的条件，双方更容易知道接下来怎么配合。", "下次有人临时求助时，先说你能帮多少、什么时候能帮。", "如果当面说不方便，事后用一句具体的话补上你的界限。"], ["把评价说得具体，对方更容易找到该改的地方。", "给反馈时指出一个可定位的例子，比如具体哪一行或哪一步。", "比较两个选项前，先约定用同一个标准。"], ["善用现场已有条件，可以缩短卡住的时间。", "给原方案设一个两分钟的排查上限。", "找一个现成的替代方案，先试一个可以撤回的小步骤。"], ["给压力反应留出缓冲，有助于保住眼前的任务，也方便之后继续沟通。", "想立刻长篇回复时，先存草稿并约一个回复时间。", "如果已经说重了，指出具体哪句话，并重新提出想解决的事。"]], "kind": "infj", "name": "INFJ", "questions": [["你发消息改约，朋友只回了一个“行”。", "问他新时间是不是不方便。", "当他同意了，见面时再看。", "觉得他有点不高兴，打算见面时主动补偿。"], ["连续两次聚餐都少了同一位朋友。", "下次照常约，看看他来不来。", "先猜他跟聚餐里的某个人闹了别扭。", "私下问他是时间难凑，还是想换种聚法。"], ["你提议去公园，朋友说“听起来不错，再想想”。", "觉得他其实不想去公园，开始找别的地方。", "问他还在考虑地点、时间，还是要不要出门。", "先看看自己选的公园有什么不方便。"], ["吃饭时，一位家人连续两天戴着耳机。以前你们常边吃边聊。", "找个方便的时候问他，最近吃饭想安静一点，还是偶尔也想聊。", "先按他想独处来相处，吃饭时尽量不打扰。", "觉得他在躲着你，接下来尽量和他错开吃饭。"], ["三个人约在同一个路口见，连续两次有人走到了对面。", "回想之前有没有发生过类似的事，再决定要不要改集合点。", "在群里说大家总是不仔细，下次一定要看清地址。", "对照两次发过的定位和照片，看看是不是同一个地方容易认错。"], ["你提议周末去郊外，群里半天没人回复。", "撤回提议，觉得大家应该没兴趣。", "补发两个出发时间，问大家是时间难凑，还是更想在市内见。", "等到晚上，看看大家空下来后会不会回复。"], ["你猜朋友不爱热闹，后来看到他主动组织了十人局。", "问他两次活动有什么差别，再调整自己的判断。", "把那次当成例外，以后还是尽量单独约他。", "觉得他可能只是不想参加你组织的活动。"], ["朋友两次问你“你几点能到？”你还没出门。", "发自己预计到达的时间。", "觉得他不相信你能准时，以后出门、上车和下车都主动报一遍。", "报预计时间，顺便问他是不是要赶下一班车或提前入场。"], ["你提议换条散步路线，同行的人两次都说“我们平时不走那边”。", "觉得他就是不喜欢换路线，以后少提新的走法。", "问他喜欢原路线的哪一点，或者新路线哪里不方便。", "先走原路线，换路的事下次再说。"], ["你提议下午一起打球，只有一人报名。你觉得地点太远，朋友觉得时间太早。", "问两位没报名的人，是地点、时间，还是活动本身不合适。", "先换到近一点的球场，看看有没人来。", "先按地点太远来解释，之后都只约附近的球场。"], ["朋友晚上十一点想打电话吐槽，你明早七点要起。", "接起来，让他讲到想挂为止。", "回“我今晚得睡了，明天再说”。", "回“今晚聊不了，明天午休我能听你说二十分钟”。"], ["朋友第三次请你帮忙找一张照片，你自己也答应今晚发一组照片给别人。", "先替他找，自己的照片晚点再发。", "说“我今晚也得整理照片。我能告诉你在哪个相册，没法替你一张张找”。", "说“我今晚有自己的安排，这次帮不了”。"], ["聚餐时，有人连续两次拿你迟到开玩笑。", "当场说“刚才那句我听着不舒服，别再拿这个开玩笑了”。", "散场后私下告诉他，你希望这个玩笑到此为止。", "当场一起笑，之后减少参加有他的聚会。"], ["家人替你答应了周六的饭局，你已经和朋友约好同一时间见面。", "说自己周六有安排，请家人帮忙取消。", "取消和朋友的约定，按家人答应的时间去。", "说自己已有约，和家人商量怎么告知对方，并请家人下次先问你。"], ["朋友倒苦水，你提了两条建议，他回“我知道”。", "继续讲完剩下的建议，想帮他少走弯路。", "问“你想让我听一会儿，还是一起想怎么办？”", "先收起建议，听他把事情讲完。"], ["群里两个人争执，有人点名请你评理，你只看到了后半段。", "说自己没看到前因，先问双方希望解决哪件事。", "说自己只看到了后半段，先不表态。", "先替语气比较委屈的一方说话，免得他被围攻。"], ["几个人准备出门，有人当众说“你发错集合地点了”，但他打开的是昨天的消息。", "私下发最新定位，请他在群里更新一下。", "先认下，免得大家当场争起来。", "当场说“那条是昨天的，我把今天的定位再发一次”。"], ["借给朋友的书已逾期两周，下周你要用。", "暂时不催，打算到时另外找一本。", "发“我周一要用，你能周日还吗？不方便我可以去拿”。", "发“这周能把书还给我吗？”"], ["几个人一起吃东西，有人坚持去一家超过你预算的店。", "说自己这顿最多能花多少，提议换一家，或吃完再汇合。", "说“这家有点贵，能不能再看看？”", "先答应去，之后少买自己本来要买的东西。"], ["朋友希望你劝另一位朋友道歉，你没在场。", "安慰他，同时说明自己不方便代传。", "先替他发消息，请对方道歉。", "陪他整理想说的话，让他自己决定发不发。"], ["两个人都说自家到公园“很近”，你们只能选一个地方集合。", "选听起来更顺路的地方。", "问清从集合点步行各要几分钟，中间要不要绕路。", "打开地图看一眼两处位置，再凭大致距离选。"], ["朋友写了一条活动通知，你说“有点难懂”，他问具体哪里难懂。", "指出集合时间藏在最后一段，建议把时间和地点移到第一行。", "说“就是整体有点乱”，请他自己再读一遍。", "圈出最难读的那一段，让他先改那里。"], ["朋友说一种叠衣服的方法“快一倍”，他只试过一件。", "接下来几天用新方法，看看自己感觉有没有变快。", "觉得看起来确实快，转发时也说“能快一倍”。", "找几件差不多的衣服，用两种方法各叠一轮，对比用时。"], ["你推荐从公园正门进，朋友指出正门到你们要去的球场，比侧门多走十五分钟。", "先讲正门附近有小店、路也好认，距离晚点再说。", "问大家还有多少时间，再比较两条路线。来不及就走侧门。", "先收回推荐，把地图上的步行时间重新查一遍。"], ["大家只能选一个游戏。一个人说甲“更适合一起玩”，另一个人说乙才适合。", "先问这次更在意“人人能同时玩”还是“一轮能很快结束”，再按同一标准比。", "先选听起来能让更多人参与的那个。", "请两人各说一个理由，再一起决定。"], ["朋友发来一张对话截图，问你“是不是他先骂人”。", "只评价截图里那句话听起来有多冲。", "根据这张图，直接判断是谁先挑起争执。", "说截图里的话确实冲，再问前后消息，暂不判断谁先开骂。"], ["你答应“等会儿”把合照发过去，对方以为十分钟，你以为晚饭后。", "回“我晚一点发，发了告诉你”。", "解释自己说的“等会儿”就是今天之内，请他再等。", "回“我七点前发。你如果现在要用，告诉我急需哪一张”。"], ["你帮朋友从两张邀请图里选一张，第一眼更喜欢颜色鲜艳的那张。", "选颜色鲜艳的，告诉朋友自己喜欢这个配色。", "先看两张的时间地点是否齐全、手机上字是否看得清，再决定。", "把另一张再看一遍，确认有没有漏掉自己喜欢的地方。"], ["你在群里说公园六点关门，后来发现你看错了，实际是五点。", "在原群更正时间，并说明原定几点到的安排还能不能用。", "先改自己的计划，等有人再问时告诉他。", "在原群更正关门时间，集合安排晚点再确认。"], ["朋友说你安排活动“只顾自己”，你觉得他说得太重。", "先解释当时为什么这么安排。", "先逐条说自己已经为大家考虑过什么。", "问他指哪项安排，弄清具体影响后再回应。"], ["几个人准备边看手机里的图边学折纸，手机突然关机。桌上有一件折好的样品。", "先找充电线，等手机开机再继续。", "问谁还能打开图片，同时用样品带大家看第一步的折痕。", "先用样品口头讲自己记得的步骤。"], ["照菜谱做饭时发现少了一种调料，客人二十分钟后到。", "先尝现有味道，少量试加手边最接近的调料。", "继续做，把缺的调料省掉。", "暂停做菜，出门买齐原调料再继续。"], ["走到换乘口才发现线路临时停运，你还有半小时赴约。", "按平时的经验，先走去常用的公交站。", "在站里反复刷新原线路的恢复时间。", "看实时备选路线，发一个新的预计到达时间。"], ["你本来要给朋友看十张照片讲一件趣事，他还有五分钟就要走。", "先选一两张最能讲清事情的照片，其余之后发给他。", "先讲准备好的前几张，没讲完的下次再说。", "照原顺序把十张都快速翻一遍。"], ["椅子装到一半，发现螺丝对不上。", "把不同的螺丝挨个往孔里试，先把这一块装上。", "放下工具，从头再看一遍说明书。", "对照当前步骤的零件编号和孔位，分清是拿错还是缺件。"], ["你想做旅行相册，有两百张照片，今晚只剩半小时。", "先把整本相册的目录和版式定下来。", "挑六张先做一页，用这一页判断版式要不要改。", "建一个候选相册，把明显想留的照片放进去。"], ["几个人想把桌子搬到隔壁，但桌面比门框宽。", "先比较桌面、桌腿和门框的宽度，再决定能否转向通过。", "先请另一个人从门框另一侧看看还有多少余量。", "先按原来抬桌子的方向多试几次。"], ["几个人跟着你去集合点，群里置顶的定位是旧的，还有人正按它导航。", "先逐个告诉正在路上的人新地点。", "先发一条“定位改了”，之后有空再改置顶。", "先换掉旧置顶，点开确认定位能用，再提醒群里看新地址。"], ["走到餐厅才发现停业，另外两人快到了。", "在群里说店没开，等大家一起决定。", "拍下门牌，确认附近一家有位，再发新地址。", "照原约定在门口等，三人到齐后再找店。"], ["你已经做了半张拼贴画，才发现要装进的相框比纸小一圈。", "对照相框标出能保留的部分，再决定裁哪里或挪哪些图。", "收好这张，从头做一张刚好能放进相框的。", "把原来的拼贴做完，最后再看能放进去多少。"], ["你答应今晚把照片发给朋友，同时两个群在催你回消息。你看着手机十分钟还没开始选图。", "按消息弹出的顺序逐条回。", "先静音十分钟，确定眼下最急的一件事并动手。", "把要回复和要做的事全记下来，再决定从哪开始。"], ["你正准备出门，朋友突然发来“我对你挺失望的”。", "回“我看到了，今晚七点有空聊”，到时先问他指哪件事。", "立刻停下来，发一长段消息解释自己的情况。", "先出门，等有空再打开对话看他有没有补充。"], ["午饭还没吃，你正在和朋友拼图。他说你刚拼的一大片方向错了，你越看越烦。", "先把最明显不合的两块取下来，剩下的晚点看。", "立即逐条解释为什么你觉得自己拼得没错。", "先吃点东西，回来再和他一起看从哪一块开始对不上。"], ["一天内两个人取消约定，你开始想“是不是谁都不想见我”。", "把后面还没确定的邀约也撤掉。", "看两人各自给的原因，晚些再决定要不要另约。", "今晚先做自己的安排，明天再想。"], ["你在群里回话太冲，隔了十分钟才发现。", "在原群说刚才哪句话说重了，再重述自己要讨论的事。", "私下给当事人发一句“刚才我语气急了”。", "等话题翻过去，下次聊天时对他客气一些。"], ["连续三天你都在帮别人整理聚会照片，自己的那份还没发。今晚又有人请你帮忙挑图。", "先答应，准备晚点再做自己的。", "说今晚接不了，继续整理自己那份。", "说今晚接不了，同时问等自己照片的人哪几张最急，先发那几张。"], ["周六本来想睡个懒觉，两个群不断@你，只说“有空看一下”。", "先把消息都回完，再继续休息。", "看一眼是否有今天必须处理的事，其余先静音。", "全部静音，中午再统一看。"], ["你教朋友玩一个新游戏，他说“有点难跟”，回家后你还在反复想。", "问他是从哪条规则开始听不懂，下次先换一种方式讲那条。", "当晚把整套讲法从头到尾重写。", "记下这句反馈，下次再教人之前看一眼。"], ["你在争执里越说越快，对方说“我已经听不进去了”。", "停下来，等对方愿意开口。", "把最后一点说完，免得对方误解你的意思。", "提议停十分钟并约好回来聊，回来后先复述对方在意的事。"], ["朋友一小时后要来玩，你原本打算先收桌子、准备饮料、找出游戏，还没开始。", "先把桌子收拾到自己满意，再做剩下两件事。", "先确定开始玩必须准备什么，留出能玩的桌面，把游戏找出来。", "把三件事都记下来，等朋友到了再一起弄。"]]}</script>
<script>
const d=JSON.parse(document.querySelector('#dataset').textContent);
const app=document.querySelector('#app');
const key='scenario-'+d.kind+'-v1';
let saved={};
try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{}
const answers=Array.from({length:50},(_,i)=>Number.isInteger(saved.answers?.[i])&&saved.answers[i]>=0&&saved.answers[i]<3?saved.answers[i]:null);
let index=0;
let complete=Boolean(saved.complete)&&answers.every(a=>a!==null);
const done=()=>answers.filter(a=>a!==null).length;
const score=(i,a=answers[i])=>a===null?0:Number(d.keys[i][a]);
const tone=i=>'--color:var(--c'+i+')';
function save(){try{localStorage.setItem(key,JSON.stringify({answers,complete}))}catch{}}
function show(html,focus=false){app.innerHTML=html;window.scrollTo(0,0);if(focus)app.querySelector('h1')?.focus({preventScroll:true})}
function graph(values,total){
  if(d.kind==='intj')return '<div class="columns" aria-hidden="true">'+values.map((v,i)=>'<div class="column" style="'+tone(i)+'"><div class="column-track"><span class="column-fill" style="height:'+(v*5)+'%"></span></div><small>'+d.codes[i]+'</small></div>').join('')+'</div>';
  return '<svg class="rings" viewBox="0 0 230 230" aria-hidden="true">'+values.map((v,i)=>{const r=101-i*14,c=2*Math.PI*r;return '<circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="9"/>'+(v?'<circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--c'+i+')" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(v*c/20)+' '+c+'" transform="rotate(-90 115 115)"/>':'')}).join('')+'<text x="115" y="121" text-anchor="middle" font-size="22" font-weight="800">'+(total??'5 项')+'</text></svg>';
}
function startButton(){return '<button class="primary" data-action="start">'+(complete?'查看上次结果':done()?'继续测试':'开始测试')+' →</button>'}
function home(){
  show('<section class="hero"><div><div class="kicker">认识你的日常应对方式</div><h1 tabindex="-1">'+d.headline+'</h1><p>'+d.about+'</p>'+startButton()+'</div><div class="hero-art"><p class="artlabel">五项结果 · 图表示意</p>'+graph([17,13,15,10,12])+'</div></section><div class="stats"><div><strong>50</strong><span class="quiet">道情景题</span></div><div><strong>5–7</strong><span class="quiet">分钟预计用时</span></div><div><strong>5</strong><span class="quiet">观察维度</span></div></div><section class="card"><h2>五个观察维度</h2><div class="grid">'+d.labels.map((x,i)=>'<div class="tile" style="'+tone(i)+'"><i class="dot"></i><h3>'+x+'</h3><p>'+d.notes[i][0]+'</p></div>').join('')+'</div></section><section class="card"><h2>做完能看到什么？</h2><p>'+d.benefit+'</p><div class="grid"><div class="tile"><h3>总档位与单项分数</h3><p>低阶、中阶或高阶，以及五项各自的分数与表现。</p></div><div class="tile"><h3>优势与场景练习</h3><p>依据实际选择，看到做得好的部分、带来的好处，以及类似场景的其他做法。</p></div></div></section><section class="card center"><h2>按最近三个月的实际表现作答</h2><p class="quiet">选你通常最先会做的事。答案保存在当前浏览器，可随时回来继续。</p>'+startButton()+'</section>');
}
function quiz(focus=true){
  const q=d.questions[index];
  show('<div class="reader"><div class="row"><button class="secondary" data-action="home">← 首页</button><span class="quiet">已答 '+done()+'／50</span></div><div class="progress" role="progressbar" aria-label="已答题数" aria-valuemin="0" aria-valuemax="50" aria-valuenow="'+done()+'"><span style="width:'+done()*2+'%"></span></div><section class="card"><div class="kicker">第 '+(index+1)+'／50 题</div><h1 class="qhead" tabindex="-1">'+q[0]+'</h1>'+q.slice(1).map((x,j)=>'<button class="choice" data-option="'+j+'" aria-pressed="'+(answers[index]===j)+'"><span class="letter">'+('ABC'[j])+'</span><span>'+x+'</span></button>').join('')+'<div class="actions"><button class="secondary" data-action="back" '+(!index?'disabled':'')+'>上一题</button><button class="primary" data-action="next" '+(answers[index]===null?'disabled':'')+'>'+(index===49?'查看结果':'下一题 →')+'</button></div></section></div>',focus);
}
function summarize(){
  const scores=d.labels.map((_,g)=>answers.slice(g*10,g*10+10).reduce((sum,a,j)=>sum+score(g*10+j,a),0));
  const total=scores.reduce((a,b)=>a+b,0);
  const gate=d.kind==='intj'&&scores.some(n=>n<10);
  const stage=total<50?'低阶':total<75||gate?'中阶':'高阶';
  return {scores,total,stage,limited:total>=75&&gate};
}
const rank=n=>n<10?'低':n<15?'中':'高';
function feedback(i,g,positive){
  const [q,...options]=d.questions[i];
  const [,practice,alternative]=d.notes[g];
  const top=options.filter((_,a)=>score(i,a)===2&&a!==answers[i]);
  return '<div class="tile feedback"><h3>'+d.labels[g]+' · 第 '+(i+1)+' 题</h3><p>'+q+'</p><blockquote>你选择：'+options[answers[i]]+'</blockquote>'+(positive?'<p>值得肯定的是，你选择了一个可以直接落实的做法。'+d.notes[g][0]+'</p>':'<ul>'+(top.length?'<li>同场景可以试：'+top[0]+'</li>':'')+'<li>'+practice+'</li><li>'+alternative+'</li></ul>')+'</div>';
}
function result(){
  const {scores,total,stage,limited}=summarize();
  const groups=scores.map((_,i)=>i);
  const high=groups.slice().sort((a,b)=>scores[b]-scores[a]);
  const low=groups.slice().sort((a,b)=>scores[a]-scores[b]);
  const indices=g=>Array.from({length:10},(_,i)=>g*10+i);
  const good=high.map(g=>indices(g).find(i=>score(i)===2)).filter(i=>i!==undefined).slice(0,3);
  const grow=low.map(g=>indices(g).find(i=>score(i)===0)??indices(g).find(i=>score(i)===1)).filter(i=>i!==undefined).slice(0,2);
  const sub=d.kind==='intj'?'<section class="card"><h2>四种补充练习</h2><p class="quiet">每种用两题回顾具体做法。</p><div class="grid">'+[
    ['扩展备选（Ne 视角）',[40,44],'给原目标和活动形式各想一个备选。'],
    ['确认对方需要（Fe 视角）',[41,45],'解释前先问对方现在想谈什么。'],
    ['调用具体经验（Si 视角）',[42,46],'把上次漏掉的细节变成这次的提醒。'],
    ['检查逻辑与定义（Ti 视角）',[43,47],'一次只改一个条件，或先核对双方对同一个词的理解。']
  ].map(([label,ids,tip])=>'<div class="tile"><h3>'+label+' · '+ids.reduce((a,i)=>a+score(i),0)+'／4</h3><p>'+tip+'</p><p class="quiet">回顾第 '+ids.map(i=>i+1).join('、')+' 题</p></div>').join('')+'</div></section>':'';
  show('<section class="card overview"><div><h1 class="qhead" tabindex="-1">你的情景应对结果</h1><div class="total">'+total+' <small>／100</small></div><div class="pill">'+stage+'</div><p class="quiet">'+(limited?'总分已达高阶区间。待拓展维度：'+d.labels.filter((_,i)=>scores[i]<10).join('、')+'。':stage==='高阶'?'你在多类场景中展现了不同的应对做法。':stage==='中阶'?'你在一些场景会调整做法，有些场景更习惯用第一反应。':'先从一种容易尝试的新做法开始。')+'</p></div>'+graph(scores,total)+'</section><section class="card"><h2>五项分数</h2><p class="quiet">每项独立按 20 分计算。图形长度表示该项得分比例。</p>'+d.labels.map((x,i)=>'<div class="metric" style="'+tone(i)+'"><div class="row"><span><i class="dot"></i>'+x+'</span><strong>'+scores[i]+'／20 · '+rank(scores[i])+'</strong></div><div class="meter" aria-hidden="true"><i style="width:'+scores[i]*5+'%"></i></div></div>').join('')+'</section><section class="card"><h2>你已经做得好的地方</h2>'+(good.length?good.map(i=>feedback(i,Math.floor(i/10),true)).join(''):'<p>这次可以先从你得分最高的“'+d.labels[high[0]]+'”开始回顾。想一件类似的小事，看看原来的做法解决了什么。</p>')+'</section><section class="card"><h2>下一次还可以怎么做</h2>'+(grow.length?grow.map(i=>feedback(i,Math.floor(i/10),false)).join(''):'<p>你这次每题都选择了本问卷评分最高的做法。可以回想最近一次遇到类似情况时，你是在什么条件下做到的。</p>')+'</section>'+sub+'<div class="row end"><button class="secondary" data-action="home">返回首页</button><button class="secondary" data-action="restart">重新测试</button></div>',true);
}
app.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  const option=button.dataset.option;
  if(option!==undefined){
    answers[index]=Number(option);complete=false;save();
    app.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    const progress=app.querySelector('.progress');
    progress.setAttribute('aria-valuenow',done());progress.firstElementChild.style.width=done()*2+'%';
    app.querySelector('.reader > .row .quiet').textContent='已答 '+done()+'／50';
    app.querySelector('[data-action=next]').disabled=false;return;
  }
  switch(button.dataset.action){
    case 'home':home();break;
    case 'start':if(complete){result();break}index=done()===50?49:answers.indexOf(null);quiz();break;
    case 'back':if(index>0){index--;quiz()}break;
    case 'next':
      if(answers[index]===null)break;
      if(index<49){index++;quiz();break}
      if(done()<50){index=answers.indexOf(null);quiz();break}
      complete=true;save();result();break;
    case 'restart':
      if(!confirm('清除本次答案，重新开始？'))break;
      answers.fill(null);complete=false;index=0;save();quiz();break;
  }
});
home();
</script>
</body></html>
