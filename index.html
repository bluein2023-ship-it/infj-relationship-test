<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f6f3"><title>INFJ 关系适配测试 · 30题</title><style>
:root{--ink:#242424;--lime:#d9e8aa;--lav:#ddd6f0;--paper:#f6f6f3;--line:#d9d9d3}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;line-height:1.65}main{max-width:720px;margin:auto;padding:25px 17px 70px}.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;color:#777}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(27px,6vw,40px);letter-spacing:-.03em;margin:3px 0 6px}h2{font-size:22px;margin:5px 0 16px}.muted{color:#747474;font-size:13px}.label{display:inline-block;padding:5px 12px;background:#242424;color:#fff;border-radius:12px;font-size:13px;font-weight:700}.bar{height:9px;background:#e8e8e3;border-radius:10px;overflow:hidden;margin:22px 0}.bar>i{display:block;height:100%;background:#b9d578;transition:width .3s}.question{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;margin:18px 0 14px}.question h2{line-height:1.45;font-size:22px;font-weight:680}.choice{display:flex;gap:15px;align-items:flex-start;width:100%;border:1px solid #deded8;border-radius:17px;padding:15px;text-align:left;background:#fff;margin:10px 0;cursor:pointer;font:inherit;color:inherit;line-height:1.55}.choice:hover{border-color:#666}.choice[aria-pressed="true"]{background:var(--lime);border:2px solid #262626;padding:14px}.choice:nth-child(even)[aria-pressed="true"]{background:var(--lav)}.letter{flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;width:35px;height:35px;background:#f0f0ed;font-weight:800}.choice[aria-pressed="true"] .letter{background:#242424;color:#fff}.nav{display:flex;justify-content:space-between;gap:12px;margin:19px 0}.btn{background:#252525;color:#fff;border:0;border-radius:13px;padding:12px 19px;cursor:pointer;font-size:15px;font-weight:650}.btn:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#fff;color:#242424;border:1px solid var(--line)}.card{padding:22px;background:#fff;border:1px solid var(--line);border-radius:20px;margin:16px 0}.total{background:#252525;color:#fff}.bigscore{font-size:60px;line-height:1.2;font-weight:750;color:#d6e6a5}.meter{height:10px;background:#ecece6;border-radius:9px;overflow:hidden}.meter>span{display:block;height:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}p{margin:9px 0}small{color:#797979}.issue{border-left:4px solid #d4c8ed;padding-left:13px;margin:10px 0}.hide{display:none}footer{padding:25px 0;font-size:12px;color:#858585}.safe{border-left:4px solid #bb655d;background:#fff6f5;padding:14px;border-radius:8px;margin:13px 0}
</style></head><body><main><header class="head"><div><div class="eyebrow">INFJ · RELATIONSHIP FIT</div><h1>关系适配度测试</h1><p class="muted">30 道真实情境题 · 六维度 · 满分 10 分</p></div><div class="label" id="count">01 / 30</div></header><section id="quiz"><div class="bar"><i id="progress" style="width:0%"></i></div><div class="row"><span id="dimension"></span><span class="muted" id="answered">0 / 30 已回答</span></div><div class="question"><div class="eyebrow" id="qn"></div><h2 id="prompt"></h2></div><div id="choices"></div><div class="nav"><button class="btn secondary" id="prev">上一题</button><button class="btn" id="next">下一题</button></div><p class="muted">请选最符合你们实际相处的一项，不必选看起来“正确”的答案。题目依据真实表现打分，不代表人格测试或医学诊断。</p></section><section id="result" class="hide"><div class="card total"><div class="eyebrow">YOUR RELATIONSHIP REPORT</div><div><span class="bigscore" id="total"></span> / 10</div><h2 id="level"></h2><p style="color:#d0d0d0">这是一套用于关系自我观察的编辑性工具，并非经过信效度验证的INFJ匹配概率。</p></div><div id="safety"></div><h2>六个关系维度</h2><div id="dimensions"></div><h2>优先改善的三个板块</h2><div id="weak"></div><h2>逐题问题定位</h2><div class="card" id="issues"></div><div class="nav"><button class="btn secondary" id="back">返回检查答案</button><button class="btn" id="restart">重新测试</button></div><button class="btn secondary" id="copy">复制结果</button></section><footer>INFJ RELATIONSHIP FIT · 不以类型标签替代对真实行为的观察。若存在控制、威胁、恐吓或暴力，优先确保安全。</footer></main><script>
const QUESTIONS=[["你对INFJ产生好感时，通常怎样判断TA是否也喜欢你？",["主要看TA主动联系、记得我的小事","我们会单独约见，但还没说破关系","反复回想聊天语气、回复时间和小动作","谈过彼此好感，双方都愿意进一步了解"],[2,2,0,3]],["当INFJ说“没事”，但你明显感觉情绪不对时？",["TA过阵子通常会主动说，我先不过问","问一次，对方说没事我便做自己的事","猜是不是自己做错，之后变得小心","约好晚点再聊，TA也会回来说明"],[2,1,0,3]],["你和INFJ通常怎样分享比较私人的经历？",["TA听我说很多，自己讲得很少","慢慢分享，谁不愿意说都可以拒绝","聊得很深，但多在深夜或情绪强烈时","不太清楚TA的过去，也不好意思问"],[1,3,2,0]],["对一句话有不同理解时，通常会发生什么？",["当时就问清楚彼此原意","TA过几天才说那句话让自己不舒服","先争论谁理解错，后来才谈问题","选择不追究，避免小事争吵"],[3,1,1,2]],["关于是否正式建立关系，最符合你们的现状？",["都想靠近，却没认真说过定位","一方想确认，另一方说明需要时间及顾虑","说清意愿，接受目前关系状态","像恋人相处，但不确定对方愿否承诺"],[1,2,3,0]],["INFJ心情不好时，你通常如何知道原因？",["TA先独处，过阵子会主动告诉我","从表情语气看出来，慢慢试着问","TA通常不说，我只能等过去","怀疑是不是我造成的，不敢确认"],[3,2,1,0]],["你试着安慰INFJ时最常发生什么？",["给解决办法，TA却觉得我不理解情绪","TA说完轻松了，不一定立刻解决","能一起分析，但不太会表达脆弱","尽量顺着TA说，怕不同意见伤人"],[1,3,2,1]],["你向INFJ倾诉自己的压力时，通常怎样？",["TA很愿意听，但不知是否已经累了","TA听我说，我也主动关心TA的状态","控制自己说负面情绪的次数","大多自己消化，因为TA烦恼也多"],[2,3,1,1]],["你们分享开心的小事时，通常怎样互动？",["互发照片、讲趣事，也接着聊几句","主要TA分享，我不一定有话回","少分享小事，但重要事情会讨论","以前分享多，现在明显减少且没谈原因"],[3,2,2,0]],["一方哭泣或脆弱时，通常怎样相处？",["会陪伴，但哭的人很快说没事","两人觉得尴尬，通常转移话题","能表达难过，也能说清需要怎样陪伴","变成讨论是谁造成了这种情绪"],[2,1,3,0]],["INFJ想独处、减少共同活动时，你们怎样处理？",["接受，商量别的时间见面","我接受，但会猜是不是感情淡了","TA常临时取消，不知下次什么时候见","提前规划个人时间，偶尔协商调整"],[3,1,0,3]],["当你们有不同意见时，最像哪种状态？",["互相解释，不必完全一致","通常是不太在意的一方先让步","很少明确拒绝，之后才发现不满意","表达反对后，可能出现冷淡或施压"],[3,2,1,0]],["关于私人信息和过去经历，你们更接近哪种状态？",["分享自愿，尊重不愿谈的边界","我想了解更多，但TA一直说以后再讲","几乎什么都说，有时又后悔说太多","隐私或过去经历会被拿来争吵"],[3,1,2,0]],["如何处理朋友、工作与恋爱时间的冲突？",["提前商量，也保留各自安排","很亲近，个人计划常为见面改变","一方总是最后才知道另一方安排","怕对方失望，常答应自己不想做的事"],[3,2,1,0]],["一方说“不方便”或“不想做”时通常怎样？",["另一方会失落，但尊重决定","继续商量，希望对方改变主意","常不明确拒绝，用借口拖延","拒绝会引发指责、持续冷淡或施压"],[3,2,1,0]],["发生争执后，你们通常怎样恢复交流？",["各自休息，第二天自然恢复","一方先道歉，尽快缓和气氛","冷静后回来谈具体问题与下一步","冷淡好几天，谁也不先开口"],[2,2,3,0]],["争论开始激烈时，最常发生什么？",["提出暂停，约好稍后继续","争到一方说算了为止","偶有人提高声音，但事后负责","出现羞辱、威胁、恐吓或故意使对方害怕"],[3,1,2,0]],["你们争吵时，通常最先讨论什么？",["各自为什么不高兴","谁先说了不好听的话","这件事具体怎样解决","过去类似的事为什么重复"],[3,1,2,2]],["一方道歉之后，通常会怎样？",["接受道歉，生活恢复","双方说清要调整的行为，之后检查","类似问题反复发生，每次重新道歉","反复质疑是否真诚，要求一再解释"],[2,3,0,1]],["回忆过去的冲突时，通常怎样？",["多数问题有了新处理方式","偶尔重提，但愿意听彼此解释","一提旧事就容易重吵","一方不愿再谈，另一方不知是否能修复"],[3,2,1,0]],["谈到换城市或换工作时，更接近哪种情况？",["一方想提前聊，另一方觉得发生再说","可讨论原则，但不要求立即决定结果","一方已做长期计划，却没告诉另一方","能讨论可能性，难达成具体共识"],[1,3,0,2]],["对关系发展的速度，双方通常怎么看？",["都较谨慎，但明确表达目前意愿","一方想确认，另一方一直不给明确说法","自然进入关系，边界后来逐渐谈","节奏不同，但说清可接受的安排"],[3,0,2,3]],["INFJ想深聊关系，你更喜欢轻松相处时？",["分别留出认真聊天和放松时间","我通常陪着聊，即使不太想谈","经常争论为什么要谈这么深","偶尔深聊，大多数时候看当下状态"],[3,1,0,2]],["对金钱、家庭和共同生活的重大问题怎么处理？",["有具体约定，也能根据现实调整","知道大致想法，还未详细讨论","容易不愉快，所以迟迟谈不清","双方要求明显冲突，一方想改变另一方"],[3,2,1,0]],["个人发展与共同关系安排冲突时通常怎样？",["先确认各自底线，共同评估选择","机会更好的一方先做决定","一方牺牲自己的机会以免冲突","讨论很久却因害怕争论不决定"],[3,1,1,1]],["约好的活动临时改变时，一般怎样处理？",["说明情况，共同决定取消或延期","忙的一方先处理，空了再约","总由同一方重新查时间和订票","取消后另一方通常很久不开心"],[3,2,1,0]],["平时谁提出约会、安排周末活动？",["通常轮流，也考虑双方兴趣","主要INFJ安排，我负责参与","主要我安排，INFJ很少表达偏好","谁有想法谁提，双方都主动"],[3,1,1,3]],["家务和生活琐事，最接近哪种状态？",["有大致分工，忙时互相调整","谁看到谁做，通常同一方先发现","一方爱照顾人，另一方接受","已多次因同样分工问题争吵"],[3,1,2,0]],["共同安排与工作压力冲突时，通常怎样？",["说明压力，一起调整","工作忙的一方拥有优先决定权","尽量互相照顾，但常常都很疲惫","相同问题反复出现，有人不再愿意安排"],[3,1,2,0]],["有人说“这段关系让我有点累”时，通常怎样？",["讨论具体累在哪里，观察有没有改善","另一方做些补偿，尽快让气氛好转","开始争谁付出得更多","一方已不愿讨论，另一方只能猜"],[3,2,1,0]]];
const DIMENSIONS=[["关系信号与沟通","辨别友善、好感与承诺，练习核实真实意愿。","INFJ：把真正的担忧转为明确问题，不靠沉默或暗示。","追求者／伴侣：直接表达意愿并确认，不用猜测代替沟通。"],["情绪回应与理解","练习双向倾听，区分情绪支持和立即解决问题。","INFJ：说明当下需要倾听、建议还是独处。","伴侣：先确认需要，再提供建议，也表达自己的精力边界。"],["个人边界与独立","明确拒绝、隐私和个人时间，避免隐性牺牲。","INFJ：直接表达休息与不愿意，不靠过度迁就证明爱。","伴侣：接受明确拒绝，不用冷淡、施压或惩罚回应。"],["冲突与修复能力","建立暂停与恢复谈话的机制，把道歉转成行动。","INFJ：说清具体不满与需要，暂停后回来讨论。","伴侣：不追逼、不过度辩解，认真承担并兑现改变。"],["未来规划与价值观","区分事实与设想，及早讨论重大决定的共同参与方式。","INFJ：不让推演代替证据，把担忧说成具体需求。","伴侣：说明真实计划，重大变化共同协商。"],["日常经营与行动","关注约定、主动性、家务和共同时间的平衡。","INFJ：说清期待与精力，不无限承担隐形劳动。","伴侣：主动安排并持续执行，不让关系只靠一方推动。"]];
const COLORS=["#c8db89","#b7a7df","#c8db89","#b7a7df","#c8db89","#b7a7df"];
let answers=Array(30).fill(null), pos=0;
const $=id=>document.getElementById(id);
function render(){const q=QUESTIONS[pos];$("count").textContent=String(pos+1).padStart(2,"0")+" / 30";$("qn").textContent="QUESTION "+String(pos+1).padStart(2,"0");$("dimension").textContent="● "+DIMENSIONS[Math.floor(pos/5)][0];$("prompt").textContent=q[0];$("answered").textContent=answers.filter(x=>x!==null).length+" / 30 已回答";$("progress").style.width=(answers.filter(x=>x!==null).length/30*100)+"%";$("choices").innerHTML="";q[1].forEach((label,i)=>{let b=document.createElement("button");b.className="choice";b.setAttribute("aria-pressed",answers[pos]===i?"true":"false");let l=document.createElement("span");l.className="letter";l.textContent="ABCD"[i];let span=document.createElement("span");span.textContent=label;b.append(l,span);b.onclick=()=>{answers[pos]=i;render()};$("choices").append(b)});$("prev").disabled=pos===0;$("next").disabled=answers[pos]===null;$("next").textContent=pos===29?"查看分析报告":"下一题"}
$("prev").onclick=()=>{if(pos>0){pos--;render();window.scrollTo(0,0)}};
$("next").onclick=()=>{if(answers[pos]===null)return;if(pos<29){pos++;render();window.scrollTo(0,0)}else{if(answers.some(x=>x===null))return;showResult()}};
function compute(){return DIMENSIONS.map((d,i)=>{let sum=0;for(let j=i*5;j<i*5+5;j++)sum+=QUESTIONS[j][2][answers[j]];return {id:i,name:d[0],score:+(sum/15*10).toFixed(1),desc:d[1],infj:d[2],partner:d[3]}})}
function node(tag,txt,cl){const e=document.createElement(tag);if(cl)e.className=cl;if(txt!==undefined)e.textContent=txt;return e}
function showResult(){$("quiz").classList.add("hide");$("result").classList.remove("hide");let scores=compute(),total=scores.reduce((s,v)=>s+v.score,0)/6;$("total").textContent=total.toFixed(1);$("level").textContent=total>=8.5?"当前相处协调度较高":total>=7?"具有一定磨合基础":total>=5?"部分互动需要调整":"多个板块出现较明显摩擦";
$("dimensions").innerHTML="";scores.forEach(s=>{const c=node("div",undefined,"card"),r=node("div",undefined,"row");r.append(node("strong",s.name),node("strong",s.score.toFixed(1)+" / 10"));const m=node("div",undefined,"meter"),v=node("span");v.style.width=s.score*10+"%";v.style.background=COLORS[s.id];m.append(v);c.append(r,m);$("dimensions").append(c)});
const sorted=[...scores].sort((a,b)=>a.score-b.score);$("weak").innerHTML="";sorted.slice(0,3).forEach((s,i)=>{const box=node("div",undefined,"card");box.append(node("h3",(i+1)+". "+s.name+" · "+s.score.toFixed(1)+"/10"),node("p",s.desc),node("strong","INFJ本人可以做什么"),node("p",s.infj),node("strong","追求者／伴侣可以做什么"),node("p",s.partner));$("weak").append(box)});
$("issues").innerHTML="";let bad=0;answers.forEach((v,i)=>{let score=QUESTIONS[i][2][v];if(score<=1){bad++;let c=node("div",undefined,"issue");c.append(node("strong","Q"+(i+1)+" · "+DIMENSIONS[Math.floor(i/5)][0]),node("p","你选择了："+QUESTIONS[i][1][v]),node("small",score===0?"值得优先关注：这个互动可能带来明显压力或边界风险。":"需要讨论：这项行为目前还不够稳定或明确。"));$("issues").append(c)}});if(!bad)$("issues").textContent="没有明显低分题目。建议讨论相对低分的维度，以及双方是否对现状都满意。";
const risk=answers[12]===3||answers[14]===3||answers[16]===3;$("safety").innerHTML=risk?'<div class="safe"><strong>边界与安全优先</strong><p>部分答案涉及隐私被用于争吵、拒绝遭施压或冲突中的威胁。即使总分较高，也不能抵消这些问题。</p></div>':"";window.scrollTo(0,0)}
$("back").onclick=()=>{$("result").classList.add("hide");$("quiz").classList.remove("hide");render()};
$("restart").onclick=()=>{answers=Array(30).fill(null);pos=0;$("result").classList.add("hide");$("quiz").classList.remove("hide");render();window.scrollTo(0,0)};
$("copy").onclick=async()=>{const s=compute(),total=s.reduce((a,b)=>a+b.score,0)/6;const value="INFJ关系适配度自评 "+total.toFixed(1)+"/10\n"+s.map(x=>x.name+" "+x.score.toFixed(1)+"/10").join("\n")+"\n本结果并非科学验证的匹配概率";try{await navigator.clipboard.writeText(value);alert("已复制结果")}catch(e){prompt("复制以下内容",value)}};
render();</script></body></html>
